[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pesc-i"
version = "0.3.0"
description = "A desktop chess board with Stockfish analysis and optional LLM explanations"
readme = "readme.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["python-chess==1.999", "chess==1.11.2"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
pesc-i = "src.gui.gui_tk:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
